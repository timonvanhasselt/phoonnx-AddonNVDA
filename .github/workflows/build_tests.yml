name: Tests & Addon Build

on:
  pull_request:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # NVDA 2025.x ships Python 3.11; 2026.x ships 3.13
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest numpy
      - name: Run tests
        run: pytest test/ -v

  build_addon:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build .nvda-addon skeleton
        run: python build_addon.py dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: dist/*.nvda-addon
